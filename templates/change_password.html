<!-- FILE PURPOSE: CHANGE PASSWORD. Hinglish: logged-in farmer apna current password verify karke new password set karta hai. -->
{% extends "base.html" %}
{% block title %}{{ texts.change_password }} • {{ texts.brand }}{% endblock %}
{% block content %}
<section class="card form">
<h1>{{ texts.change_password }}</h1>
<form method="POST">
<label>{{ texts.current_password }}</label>
<input type="password" name="current_password" required autocomplete="current-password">
<label>{{ texts.new_password }}</label>
<input type="password" name="password" minlength="6" required autocomplete="new-password">
<label>{{ texts.confirm_password }}</label>
<input type="password" name="password2" minlength="6" required autocomplete="new-password">
<button class="btn full">{{ texts.change_password }}</button>
</form>
</section>
{% endblock %}
